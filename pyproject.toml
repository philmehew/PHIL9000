[project]
name = "phil9000"
version = "0.1.0"
description = "PHIL9000 learns household behaviour by deriving patterns from Home Assistant sensor data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[tool.uv]
# Not a distributable package: the deliverable is custom_components/phil9000/,
# installed into Home Assistant via HACS. Dev happens in-place.
package = false

[dependency-groups]
dev = [
    "homeassistant>=2025.4.4",
    "prek>=0.5.11",
    "pytest>=8.0",
    "pytest-homeassistant-custom-component>=0.13.236",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
