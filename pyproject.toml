[project]
name = "hal1976"
version = "0.1.0"
description = "HAL1976 learns household behaviour by deriving patterns from Home Assistant sensor data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[tool.uv]
# Not a distributable package: the deliverable is custom_components/hal1976/,
# installed into Home Assistant via HACS. Dev happens in-place.
package = false

[dependency-groups]
dev = [
    "homeassistant>=2025.4.4",
    "pytest>=8.0",
    "pytest-homeassistant-custom-component>=0.13.236",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
